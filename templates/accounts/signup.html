{% extends "base.html" %}

{% block title %}Kayıt ol · What now?{% endblock %}

{% block content %}
  <h1>Kayıt ol</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Kayıt ol</button>
  </form>
  <p>
    Zaten hesabın var mı?
    <a href="{% url 'accounts:login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Giriş yap</a>
  </p>
{% endblock %}
