{% extends "base.html" %}

{% block title %}Giriş yap · What now?{% endblock %}

{% block content %}
  <h1>Giriş yap</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Giriş yap</button>
  </form>
  <p>
    Hesabın yok mu?
    <a href="{% url 'accounts:signup' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Kayıt ol</a>
  </p>
{% endblock %}
