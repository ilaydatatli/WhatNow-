<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="200" height="200" viewBox="0 0 200 200">
  <!-- Original hand-drawn style doodles: paw prints, bones, stars and hearts. Tiles seamlessly. -->
  <defs>
    <g id="paw">
      <path d="M-10 4 C-11 -5 11 -5 10 4 C9 11 -9 11 -10 4 Z"/>
      <ellipse cx="-11" cy="-9" rx="3.6" ry="4.6" transform="rotate(-20 -11 -9)"/>
      <ellipse cx="-4" cy="-15" rx="3.6" ry="4.8" transform="rotate(-6 -4 -15)"/>
      <ellipse cx="4.5" cy="-15" rx="3.6" ry="4.8" transform="rotate(8 4.5 -15)"/>
      <ellipse cx="11.5" cy="-8.5" rx="3.6" ry="4.6" transform="rotate(22 11.5 -8.5)"/>
    </g>
    <g id="bone">
      <circle cx="-15" cy="-4" r="4.6"/>
      <circle cx="-15" cy="4" r="4.6"/>
      <circle cx="15" cy="-4" r="4.6"/>
      <circle cx="15" cy="4" r="4.6"/>
      <path d="M-15 -3.4 Q0 -2 15 -3.4 L15 3.4 Q0 2 -15 3.4 Z"/>
    </g>
    <path id="star" fill="none" stroke-width="2" stroke-linejoin="round"
          d="M0 -9 L2.4 -3.2 L8.6 -2.8 L3.8 1.2 L5.3 7.3 L0 4 L-5.3 7.3 L-3.8 1.2 L-8.6 -2.8 L-2.4 -3.2 Z"/>
    <path id="heart" fill="none" stroke-width="2" stroke-linejoin="round"
          d="M0 6 C-11 -1 -8 -11 0 -5 C8 -11 11 -1 0 6 Z"/>
    <path id="sparkle" d="M0 -5 L1.2 -1.2 L5 0 L1.2 1.2 L0 5 L-1.2 1.2 L-5 0 L-1.2 -1.2 Z"/>
  </defs>

  <g fill="#7A6563" stroke="#7A6563" stroke-linecap="round" opacity="0.09">
    <use xlink:href="#paw" transform="translate(38 44) rotate(-18)" stroke="none"/>
    <use xlink:href="#bone" transform="translate(142 38) rotate(28) scale(0.9)" stroke="none"/>
    <use xlink:href="#star" transform="translate(100 104) rotate(8)"/>
    <use xlink:href="#heart" transform="translate(36 152) rotate(-10) scale(1.3)"/>
    <use xlink:href="#paw" transform="translate(156 160) rotate(24) scale(0.8)" stroke="none"/>
    <use xlink:href="#heart" transform="translate(96 30) rotate(12) scale(0.8)"/>
    <use xlink:href="#bone" transform="translate(70 178) rotate(-14) scale(0.7)" stroke="none"/>
    <use xlink:href="#sparkle" transform="translate(172 104)" stroke="none"/>
    <use xlink:href="#sparkle" transform="translate(22 98) scale(0.7)" stroke="none"/>
    <use xlink:href="#star" transform="translate(116 158) rotate(-14) scale(0.6)"/>
  </g>
</svg>
