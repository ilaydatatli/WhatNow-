<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <!-- Original hand-drawn style doodles: open book, book stack, bookmark, film reel, pencil.
       Every shape stays inside the tile so it repeats seamlessly. -->
  <defs>
    <g id="open-book">
      <path d="M0 -10 C-8 -15 -18 -15 -26 -11 L-26 13 C-18 9 -8 9 0 14 Z"/>
      <path d="M0 -10 C8 -15 18 -15 26 -11 L26 13 C18 9 8 9 0 14 Z"/>
      <path d="M-20 -5 C-14 -8 -8 -8 -5 -6 M-20 1 C-14 -2 -8 -2 -5 0 M5 -6 C8 -8 14 -8 20 -5 M5 0 C8 -2 14 -2 20 1"/>
    </g>
    <g id="book-stack">
      <rect x="-22" y="6" width="44" height="9" rx="1.5"/>
      <rect x="-18" y="-4" width="38" height="10" rx="1.5"/>
      <rect x="-20" y="-13" width="34" height="9" rx="1.5"/>
      <path d="M-14 6 L-14 15 M12 -4 L12 6 M-12 -13 L-12 -4"/>
    </g>
    <g id="bookmark">
      <path d="M-7 -16 L7 -16 L7 16 L0 9 L-7 16 Z"/>
    </g>
    <g id="film-reel">
      <circle r="15"/>
      <circle r="3"/>
      <circle cx="0" cy="-8.5" r="3.4"/>
      <circle cx="8" cy="2.8" r="3.4"/>
      <circle cx="-8" cy="2.8" r="3.4"/>
      <path d="M15 4 C22 10 28 10 32 6"/>
    </g>
    <g id="pencil">
      <path d="M-22 -4 L14 -4 L22 0 L14 4 L-22 4 Z"/>
      <path d="M14 -4 L14 4 M-16 -4 L-16 4"/>
    </g>
  </defs>

  <g fill="none" stroke="#6B655A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.1">
    <use xlink:href="#open-book" transform="translate(48 46) rotate(-8)"/>
    <use xlink:href="#book-stack" transform="translate(178 58) rotate(6)"/>
    <use xlink:href="#bookmark" transform="translate(120 128) rotate(14)"/>
    <use xlink:href="#film-reel" transform="translate(50 178) rotate(-12)"/>
    <use xlink:href="#pencil" transform="translate(186 186) rotate(-32)"/>
    <circle cx="118" cy="40" r="1.6" fill="#6B655A"/>
    <circle cx="206" cy="122" r="1.6" fill="#6B655A"/>
    <circle cx="26" cy="112" r="1.6" fill="#6B655A"/>
    <circle cx="128" cy="210" r="1.6" fill="#6B655A"/>
  </g>
</svg>
